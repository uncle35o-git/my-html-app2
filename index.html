<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞬間英作文トレーニング</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #1a73e8; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .question-box { margin-bottom: 2rem; }
        .japanese {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 1rem;
            display: block;
        }
        .scramble {
            font-size: 1.1rem;
            color: #555;
            background: #e8f0fe;
            padding: 1rem;
            border-radius: 8px;
            line-height: 1.6;
            letter-spacing: 1px;
        }
        .answer-section {
            margin-top: 1.5rem;
            display: none;
        }
        .answer-text {
            font-size: 1.3rem;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .voice-buttons {
            margin-top: 0.8rem;
            display: flex;
            justify-content: center;
            gap: 0.6rem;
        }
        .btn-voice {
            background-color: #fff;
            color: #1a73e8;
            border: 2px solid #1a73e8;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1rem;
        }
        .btn-voice:hover {
            background-color: #1a73e8;
            color: white;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-show {
            background-color: #1a73e8;
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
        }
        .btn-show:hover { background-color: #1557b0; }
        .btn-next {
            background-color: #34a853;
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .btn-next:hover { background-color: #2d8e47; }
        .set-selector {
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }
        .set-selector select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }
        .progress {
            font-size: 0.8rem;
            color: #888;
            margin-top: 2rem;
        }
        .speed-selector {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            align-items: center;
        }
        .btn-speed {
            background-color: #fff;
            color: #555;
            border: 2px solid #ccc;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.9rem;
        }
        .btn-speed.active {
            background-color: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }
        .btn-speed:hover { background-color: #e8f0fe; }
        .btn-speed.active:hover { background-color: #1557b0; }
        .toggle-controls {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
        }
        .btn-toggle {
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.95rem;
        }
        .btn-hint-toggle {
            background-color: #1a73e8;
            color: white;
            border: 2px solid #1a73e8;
        }
        .btn-hint-toggle.off {
            background-color: #fff;
            color: #555;
            border: 2px solid #ccc;
        }
        .btn-auto-toggle {
            background-color: #fff;
            color: #e65100;
            border: 2px solid #e65100;
        }
        .btn-auto-toggle.active {
            background-color: #e65100;
            color: white;
        }
        .btn-hint-toggle:hover { opacity: 0.85; }
        .btn-auto-toggle:hover { opacity: 0.85; }
        .countdown {
            font-size: 1rem;
            color: #e65100;
            font-weight: bold;
            min-width: 40px;
            text-align: left;
        }
        .timer-bar-wrap {
            width: 100%;
            background: #eee;
            border-radius: 5px;
            height: 6px;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            display: none;
        }
        .timer-bar {
            height: 6px;
            background: #1a73e8;
            border-radius: 5px;
            transition: width 1s linear;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>瞬間英作文トレーニング</h1>

    <div class="set-selector">
        <label for="part-select">パート：</label>
        <select id="part-select" onchange="switchSet()">
            <option value="A">TOEIC Part2（瞬間英作文）</option>
            <option value="B">TOEIC Part1（写真描写・状況英作文）</option>
        </select>
        <label for="set-select" style="margin-left:0.8rem;">セット：</label>
        <select id="set-select" onchange="switchSet()">
            <option value="1">Set1</option>
            <option value="2">Set2</option>
        </select>
    </div>

    <div class="speed-selector">
        <span style="font-size:0.9rem;color:#555;">英語速度：</span>
        <button class="btn-speed" onclick="setSpeed(0.7)">遅い</button>
        <button class="btn-speed active" onclick="setSpeed(1.0)">普通</button>
        <button class="btn-speed" onclick="setSpeed(1.3)">速い</button>
    </div>

    <div class="toggle-controls">
        <button id="btn-hint" class="btn-toggle btn-hint-toggle" onclick="toggleHint()">💡ON</button>
        <button id="btn-auto" class="btn-toggle btn-auto-toggle" onclick="toggleAuto()">⏱ 自動OFF</button>
        <span id="countdown" class="countdown"></span>
    </div>
    <div class="timer-bar-wrap" id="timer-bar-wrap">
        <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="question-box">
        <span id="jp-text" class="japanese"></span>
        <div id="scramble-text" class="scramble"></div>
        <div id="answer-area" class="answer-section">
            <div id="en-text" class="answer-text"></div>
            <div class="voice-buttons">
                <button class="btn-voice" onclick="speakEnglish('US')">ア</button>
                <button class="btn-voice" onclick="speakEnglish('GB')">イ</button>
                <button class="btn-voice" onclick="speakEnglish('AU')">オ</button>
            </div>
        </div>
    </div>

    <button id="action-btn" class="btn-show" onclick="toggleAnswer()">答えを見る</button>
    <br>
    <button id="next-btn" class="btn-next" onclick="nextQuestion()" style="display: none;">次の問題へ</button>
    <div class="progress" id="progress-text"></div>
</div>

<script>
// 問題データは外部JSONファイル（quiz{Part}-{Set}.json 例: quizA-1.json）から読み込みます
// ==== 進捗・設定の保存（localStorage） ====
const STORAGE_KEY = 'shunkanEisakubunProgress_v1';

function loadAppState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) throw new Error('no saved data');
        const parsed = JSON.parse(raw);
        return {
            lastPart: parsed.lastPart || 'A',
            lastSet: parsed.lastSet || '1',
            settings: {
                hintVisible: typeof parsed.settings?.hintVisible === 'boolean' ? parsed.settings.hintVisible : true,
                englishRate: typeof parsed.settings?.englishRate === 'number' ? parsed.settings.englishRate : 1.0
            },
            progress: (parsed.progress && typeof parsed.progress === 'object') ? parsed.progress : {}
        };
    } catch (e) {
        return {
            lastPart: 'A',
            lastSet: '1',
            settings: { hintVisible: true, englishRate: 1.0 },
            progress: {}
        };
    }
}

function saveAppState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    } catch (e) {
        console.error('進捗の保存に失敗しました', e);
    }
}

// 現在のパート・セットについて、残りキューと周回数を保存する
function saveProgress() {
    const part = document.getElementById('part-select').value;
    const set = document.getElementById('set-select').value;
    const key = `${part}-${set}`;
    appState.progress[key] = { queue: quizQueue, round: roundNumber };
    appState.lastPart = part;
    appState.lastSet = set;
    saveAppState();
}

let appState = loadAppState();
// ==== ここまで ====

let quizCache = {};       // 例: { "A-1": [...], "B-1": [...] } キャッシュ済みデータ

let currentQuiz = null;
let quizIndex = 0;
let activeQuizData = [];
let quizQueue = [];       // 「まだ出題していない問題」のシャッフル済みキュー（要素は元配列のインデックス）
let roundNumber = 0;      // 全問1周ごとにカウントアップ
let englishRate = appState.settings.englishRate;
const japaneseRate = 0.7;
let autoMode = false;
let autoTimer = null;
let countdownInterval = null;
let autoStep = 'question';
let remainingSeconds = 0;
let hintVisible = appState.settings.hintVisible;
const QUESTION_TIME = 15;
const NEXT_TIME = 10;

if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
    };
}

// Fisher-Yatesシャッフル（元の配列は変更しない）
function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// activeQuizDataのインデックスを全部シャッフルしてキューに詰め直す（重複なし出題用）
function refillQueue() {
    const indices = activeQuizData.map((_, i) => i);
    const newQueue = shuffleArray(indices);
    // 前の周の最後の問題が、次の周の最初に来て連続しないようにする
    if (currentQuiz && newQueue.length > 1 && activeQuizData[newQueue[0]] === currentQuiz) {
        const swapIdx = 1 + Math.floor(Math.random() * (newQueue.length - 1));
        [newQueue[0], newQueue[swapIdx]] = [newQueue[swapIdx], newQueue[0]];
    }
    quizQueue = newQueue;
    roundNumber++;
}

// quiz{part}-{set}.json をfetchで読み込む（キャッシュ済みならそれを返す）
async function fetchQuizFile(part, set) {
    const key = `${part}-${set}`;
    if (quizCache[key]) return quizCache[key];

    const filename = `quiz${part}-${set}.json`;
    const res = await fetch(filename);
    if (!res.ok) {
        if (res.status === 404) throw new Error('NOT_FOUND');
        throw new Error('load failed: ' + res.status);
    }
    const data = await res.json();
    quizCache[key] = data;
    return data;
}

// プルダウン（パート・セット）の選択に応じて問題データを読み込み、出題を切り替える
async function switchSet() {
    const part = document.getElementById('part-select').value;
    const set = document.getElementById('set-select').value;

    clearAutoTimers();
    document.getElementById('jp-text').innerText = '';
    document.getElementById('scramble-text').innerText = '';
    document.getElementById('progress-text').innerText = '問題データを読み込み中...';
    document.getElementById('action-btn').style.display = 'none';

    try {
        const data = await fetchQuizFile(part, set);
        activeQuizData = data;

        const key = `${part}-${set}`;
        const saved = appState.progress[key];
        const savedQueueValid = saved && Array.isArray(saved.queue) &&
            saved.queue.every(i => Number.isInteger(i) && i >= 0 && i < activeQuizData.length);

        if (savedQueueValid) {
            quizQueue = saved.queue.slice();
            roundNumber = saved.round || 1;
        } else {
            quizQueue = [];
            roundNumber = 0;
        }

        document.getElementById('action-btn').style.display = 'inline-block';
        nextQuestion();
    } catch (err) {
        if (err.message === 'NOT_FOUND') {
            document.getElementById('progress-text').innerText = 'この問題集はまだ準備中です。';
        } else {
            console.error(err);
            document.getElementById('progress-text').innerText =
                '問題データの読み込みに失敗しました。quiz' + part + '-' + set + '.json を、このHTMLファイルと同じフォルダに置き、サーバー経由（file://ではなくhttp(s)://）で開いてください。';
        }
    }
}

function setSpeed(rate) {
    englishRate = rate;
    appState.settings.englishRate = rate;
    saveAppState();
    document.querySelectorAll('.btn-speed').forEach(btn => {
        btn.classList.remove('active');
    });
    const labels = { 0.7: '遅い', 1.0: '普通', 1.3: '速い' };
    document.querySelectorAll('.btn-speed').forEach(btn => {
        if (btn.innerText === labels[rate]) btn.classList.add('active');
    });
}

function toggleHint() {
    hintVisible = !hintVisible;
    appState.settings.hintVisible = hintVisible;
    saveAppState();
    const btn = document.getElementById('btn-hint');
    const scramble = document.getElementById('scramble-text');
    if (hintVisible) {
        btn.classList.remove('off');
        btn.innerText = '💡ON';
        scramble.style.display = 'block';
    } else {
        btn.classList.add('off');
        btn.innerText = '💡OFF';
        scramble.style.display = 'none';
    }
}

function toggleAuto() {
    autoMode = !autoMode;
    const btn = document.getElementById('btn-auto');
    if (autoMode) {
        btn.classList.add('active');
        btn.innerText = '⏱ 自動ON';
        document.getElementById('timer-bar-wrap').style.display = 'block';
        startAutoQuestion();
    } else {
        btn.classList.remove('active');
        btn.innerText = '⏱ 自動OFF';
        document.getElementById('timer-bar-wrap').style.display = 'none';
        clearAutoTimers();
        document.getElementById('countdown').innerText = '';
    }
}

function clearAutoTimers() {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
}

function speakJapanese(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    utterance.rate = japaneseRate;
    const voices = window.speechSynthesis.getVoices();
    const matched = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja');
    if (matched) utterance.voice = matched;
    window.speechSynthesis.speak(utterance);
}

function speakEnglish(accent) {
    if (!('speechSynthesis' in window) || !currentQuiz) return;
    window.speechSynthesis.cancel();
    const langMap = { 'US': 'en-US', 'GB': 'en-GB', 'AU': 'en-AU' };
    const targetLang = langMap[accent];
    const utterance = new SpeechSynthesisUtterance(currentQuiz.en);
    utterance.lang = targetLang;
    utterance.rate = englishRate;
    const voices = window.speechSynthesis.getVoices();
    const matched = voices.find(v => v.lang === targetLang);
    if (matched) {
        utterance.voice = matched;
    } else {
        const fallback = voices.find(v => v.lang && v.lang.startsWith('en'));
        if (fallback) utterance.voice = fallback;
    }
    window.speechSynthesis.speak(utterance);
}

function startAutoQuestion() {
    if (!autoMode) return;
    autoStep = 'question';
    remainingSeconds = QUESTION_TIME;
    updateCountdown(remainingSeconds, QUESTION_TIME);
    if (currentQuiz) speakJapanese(currentQuiz.jp);
    countdownInterval = setInterval(() => {
        remainingSeconds--;
        updateCountdown(remainingSeconds, QUESTION_TIME);
        if (remainingSeconds <= 0) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
    }, 1000);
    autoTimer = setTimeout(() => {
        if (!autoMode) return;
        toggleAnswer();
        speakEnglish('US');
        startAutoNext();
    }, QUESTION_TIME * 1000);
}

function startAutoNext() {
    if (!autoMode) return;
    autoStep = 'answer';
    remainingSeconds = NEXT_TIME;
    updateCountdown(remainingSeconds, NEXT_TIME);
    countdownInterval = setInterval(() => {
        remainingSeconds--;
        updateCountdown(remainingSeconds, NEXT_TIME);
        if (remainingSeconds <= 0) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
    }, 1000);
    autoTimer = setTimeout(() => {
        if (!autoMode) return;
        nextQuestion();
    }, NEXT_TIME * 1000);
}

function updateCountdown(sec, total) {
    document.getElementById('countdown').innerText = `${sec}秒`;
    const bar = document.getElementById('timer-bar');
    const pct = (sec / total) * 100;
    bar.style.transition = sec === total ? 'none' : 'width 1s linear';
    bar.style.width = pct + '%';
}

function nextQuestion() {
    if (!activeQuizData || activeQuizData.length === 0) return;

    clearAutoTimers();
    window.speechSynthesis.cancel();
    document.getElementById('answer-area').style.display = 'none';
    document.getElementById('action-btn').style.display = 'inline-block';
    document.getElementById('action-btn').innerText = '答えを見る';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('countdown').innerText = '';

    if (quizQueue.length === 0) refillQueue();
    const idx = quizQueue.shift();
    currentQuiz = activeQuizData[idx];

    document.getElementById('jp-text').innerText = currentQuiz.jp;
    document.getElementById('scramble-text').innerText = `ヒント：\n${currentQuiz.scramble}`;
    document.getElementById('en-text').innerText = currentQuiz.en;
    const doneInRound = activeQuizData.length - quizQueue.length;
    document.getElementById('progress-text').innerText =
        `全${activeQuizData.length}問中 ${doneInRound}問目（${roundNumber}周目）`;

    saveProgress();

    document.getElementById('scramble-text').style.display = hintVisible ? 'block' : 'none';

    if (autoMode) startAutoQuestion();
}

function toggleAnswer() {
    document.getElementById('scramble-text').style.display = 'none';
    document.getElementById('answer-area').style.display = 'block';
    document.getElementById('action-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'inline-block';
}

// 前回の状態（パート・セット・設定）をUIに反映してから読み込みを開始する
function initUI() {
    document.getElementById('part-select').value = appState.lastPart;
    document.getElementById('set-select').value = appState.lastSet;

    const hintBtn = document.getElementById('btn-hint');
    if (hintVisible) {
        hintBtn.classList.remove('off');
        hintBtn.innerText = '💡ON';
    } else {
        hintBtn.classList.add('off');
        hintBtn.innerText = '💡OFF';
    }

    document.querySelectorAll('.btn-speed').forEach(btn => btn.classList.remove('active'));
    const labels = { 0.7: '遅い', 1.0: '普通', 1.3: '速い' };
    document.querySelectorAll('.btn-speed').forEach(btn => {
        if (btn.innerText === labels[englishRate]) btn.classList.add('active');
    });
}

initUI();
switchSet();
</script>
</body>
</html>
